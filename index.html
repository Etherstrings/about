<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etherstrings 能力速览</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1b1b1f;--sub:#5d5d66;--line:#e6e4dd;--accent:#ff5a1f;--accent-soft:#fff1ea;--chip:#f1f0eb;--todo:#fff6c7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c20;--ink:#f2f2f4;--sub:#a0a0aa;--line:#2c2c32;--accent:#ff7a45;--accent-soft:#2a1d17;--chip:#26262b;--todo:#4a4115}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c20;--ink:#f2f2f4;--sub:#a0a0aa;--line:#2c2c32;--accent:#ff7a45;--accent-soft:#2a1d17;--chip:#26262b;--todo:#4a4115}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.55;padding:24px 16px}
.card{max-width:440px;margin:0 auto;background:var(--card);border-radius:20px;padding:28px 24px;border:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:26px;letter-spacing:.5px}
.role{font-size:14px;color:var(--sub)}
.tag{margin-top:12px;font-size:17px;font-weight:600;line-height:1.5}
.tag b{color:var(--accent)}
h2{font-size:12px;letter-spacing:2px;color:var(--sub);font-weight:600;margin:26px 0 10px}
.str{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.str div{background:var(--accent-soft);border-radius:12px;padding:10px}
.str strong{display:block;font-size:14px;color:var(--accent)}
.str span{font-size:12px;color:var(--sub);line-height:1.4;display:block;margin-top:4px}
.hero{background:var(--accent-soft);border-radius:14px;padding:16px}
.hero .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero .t{font-weight:800;font-size:17px}
.badge{background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.hero .d{font-size:13px;color:var(--sub);margin-top:6px}
.hero li{list-style:none;margin-top:10px;font-size:13.5px;line-height:1.5}
.hero li b{display:block;font-size:14.5px}
.hero li span{color:var(--sub)}
.hero .chips span{background:var(--card)}
.p{padding:12px 0;border-top:1px solid var(--line)}
.p:first-of-type{border-top:0;padding-top:0}
.p .n{font-weight:700;font-size:15px}
.p .w{font-size:13.5px;color:var(--sub);margin-top:2px}
.p .f{font-size:13.5px;margin-top:4px}
.p .f::before{content:"→ ";color:var(--accent);font-weight:700}
.chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.chips span{font-size:11px;background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--sub)}
.more{font-size:13px;color:var(--sub);margin-top:6px}
.offer li{list-style:none;font-size:14px;margin-top:6px;padding-left:18px;position:relative}
.offer li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:700}
.foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between}
.todo{background:var(--todo);border-radius:4px;padding:0 3px}
@media (max-width:380px){.str{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="card" id="card"></main>
<script src="data.js"></script>
<script>
const d=window.PROFILE, $=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const t=s=>$(s).replace(/【[^】]*】/g,m=>`<span class="todo">${m}</span>`);
const hl=s=>t(s).replace(/(千万级流量|上线收款)/g,"<b>$1</b>");
document.getElementById("card").innerHTML=`
<div class="top"><h1>${t(d.name)}</h1><span class="role">${t(d.role)}</span></div>
<p class="tag">${hl(d.tagline)}</p>
<h2>我擅长</h2>
<div class="str">${d.strengths.map(s=>`<div><strong>${t(s.title)}</strong><span>${t(s.desc)}</span></div>`).join("")}</div>
<h2>代表作</h2>
<div class="hero"><div class="h"><span class="t">${t(d.series.title)}</span><span class="badge">${t(d.series.badge)}</span></div>
<p class="d">${t(d.series.desc)}</p>
<ul>${d.series.items.map(i=>`<li><b>${t(i.name)}</b><span>${t(i.what)}</span></li>`).join("")}</ul>
<div class="chips" style="margin-top:12px">${d.series.stack.map(s=>`<span>${t(s)}</span>`).join("")}</div></div>
<h2>其他作品</h2>
${d.projects.map(p=>`<div class="p"><div class="n">${t(p.name)}</div><div class="w">${t(p.what)}</div><div class="f">${t(p.fact)}</div><div class="chips">${p.stack.map(s=>`<span>${t(s)}</span>`).join("")}</div></div>`).join("")}
<p class="more">${t(d.more)}</p>
<h2>适合交给我的事</h2>
<ul class="offer">${d.offer.map(o=>`<li>${t(o)}</li>`).join("")}</ul>
<div class="foot"><span>${t(d.contact)}</span><span>欢迎聊</span></div>`;
</script>
</body>
</html>
