name: 发布网页和长图
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装中文字体
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      - name: 生成长图
        run: CHROME=google-chrome ./shot.sh
      - name: 打包站点
        run: mkdir _site && cp index.html data.js _site/ && cp out/brief.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
